<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .stream-wave1 {
        stroke-dasharray: 20 10;
        animation: flowStream 12s linear infinite;
      }
      .stream-wave2 {
        stroke-dasharray: 15 15;
        animation: flowStreamRev 16s linear infinite;
      }
      .pulse-node {
        animation: pulseAnim 3s ease-in-out infinite alternate;
      }
      .pulse-node-2 {
        animation: pulseAnim 2.5s ease-in-out infinite alternate;
      }
      .particle-1 {
        animation: particleMove1 8s linear infinite;
      }
      .particle-2 {
        animation: particleMove2 10s linear infinite;
      }
      .particle-3 {
        animation: particleMove3 7s linear infinite;
      }
      @keyframes flowStream {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -300; }
      }
      @keyframes flowStreamRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 300; }
      }
      @keyframes pulseAnim {
        0% { opacity: 0.35; transform: scale(0.96); }
        100% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes particleMove1 {
        0% { transform: translate(-100px, 0); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translate(1250px, 40px); opacity: 0; }
      }
      @keyframes particleMove2 {
        0% { transform: translate(1250px, 0); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translate(-100px, -30px); opacity: 0; }
      }
      @keyframes particleMove3 {
        0% { transform: translate(-50px, 30px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translate(1250px, -20px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Tech Border -->
  <rect width="1196" height="336" x="2" y="2" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1192" height="332" x="4" y="4" rx="13" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2" />

  <!-- DYNAMIC / ANIMATED BACKGROUND FLOW LINES (BEHIND CONTENT) -->
  <g opacity="0.45">
    <path class="stream-wave1" d="M -50 80 C 250 160, 450 -10, 800 90 C 1000 150, 1150 70, 1250 85" fill="none" stroke="url(#streamGrad1)" stroke-width="3.5" filter="url(#glow)" />
    <path class="stream-wave2" d="M -50 250 C 200 180, 500 320, 750 240 C 950 170, 1100 280, 1250 220" fill="none" stroke="url(#streamGrad2)" stroke-width="3" filter="url(#glow)" />
    <path class="stream-wave1" d="M -50 160 C 300 240, 600 80, 900 210 C 1050 270, 1180 180, 1250 170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- Dynamic Flying Streaming Particles -->
  <g>
    <circle class="particle-1" cx="0" cy="90" r="4" fill="#00f2fe" filter="url(#glow)" />
    <circle class="particle-1" cx="-80" cy="110" r="2.5" fill="#38ef7d" filter="url(#glow)" />
    <circle class="particle-2" cx="0" cy="230" r="3.5" fill="#ff007f" filter="url(#glow)" />
    <circle class="particle-3" cx="0" cy="165" r="4" fill="#7928ca" filter="url(#glow)" />
  </g>

  <!-- Soft Ambient Glow Orbs -->
  <g opacity="0.25">
    <circle cx="150" cy="70" r="130" fill="#00f2fe" filter="url(#glow)" class="pulse-node" />
    <circle cx="1050" cy="270" r="140" fill="#7928ca" filter="url(#glow)" class="pulse-node-2" />
  </g>

  <!-- FOREGROUND: TITLE, BADGES, AND HIGHLIGHTS -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <g transform="translate(60, 42)">
      <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillGlow)" />
      <circle cx="18" cy="16" r="4.5" fill="#38ef7d" filter="url(#glow)" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38ef7d" letter-spacing="1.2">REAL-TIME DATA PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Real-Time Streaming Data Ingestion
    </text>

    <!-- Subtitle -->
    <text x="60" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Curated Architectures, Enterprise SaaS, CDC Connectors &amp; Open-Source Distributed Engines
    </text>

    <!-- Architecture & Capability Pills in Foreground -->
    <g transform="translate(60, 212)">
      <!-- Pill 1: Event Brokers -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">⚡ Event Brokers</text>
      </g>

      <!-- Pill 2: CDC Engines -->
      <g transform="translate(195, 0)">
        <rect width="175" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399">🔄 CDC &amp; WAL Tails</text>
      </g>

      <!-- Pill 3: Stream Processing -->
      <g transform="translate(385, 0)">
        <rect width="200" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c084fc">🌊 Stream Processing</text>
      </g>

      <!-- Pill 4: Sub-Second Latency -->
      <g transform="translate(600, 0)">
        <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f472b6">⏱️ &lt; 50ms Latency</text>
      </g>

      <!-- Pill 5: Unified Serving -->
      <g transform="translate(805, 0)">
        <rect width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">🎯 Real-Time OLAP</text>
      </g>
    </g>

    <!-- Bottom Footer Meta Info -->
    <g transform="translate(60, 296)">
      <circle cx="6" cy="6" r="4" fill="#38ef7d" />
      <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">
        Apache 2.0 • Kafka KRaft • Flink CDC • Debezium • RisingWave • Redpanda • Vector
      </text>
    </g>
  </g>
</svg>
